# Network-partition experiment: which side's chain survives when a partition heals?
#
# Ten miners with equal hash power, every pair directly connected with a fixed 100 ms latency,
# and a 60 s mean block interval T. From 10 to 20 minutes the nodes listed in
# net.partition.nodes are cut off from the others: each side mines its own branch, and when the
# partition heals the longer branch wins and the other one is orphaned.
# tools/partitions/partition_sweep.sh varies the cut-off side's share of the hash power and
# compares the outcomes with the Poisson race. See examples/partitions/README.md.
#   java -jar target/cnsim-0.0.1-SNAPSHOT.jar -c examples/partitions/partition.properties

sim.numSimulations = 100
sim.maxNodes = 64
sim.terminate.atTime = 5400000
sim.reporting.window = 100000
sim.reporting.beliefReportInterval = 10000
sim.reporting.beliefReportOffset = 0
sim.output.directory = ./out/partition/

# The partition: nodes 1-3 (30% of the hash power) are cut off from 10 to 20 minutes.
net.partition.nodes = {1,2,3}
net.partition.start = 1800000
net.partition.end = 2400000

# Block production: equal miners, 60 s mean interval
pow.targetBlockInterval = 60000
pow.hashPowerMean = 1.0E+10
pow.hashPowerSD = 0
bitcoin.maxBlockSize = 1000000
consensus.tieBreak = first-seen

# Every pair of nodes connected; 1 Tbps links with a fixed 100 ms latency.
net.numOfNodes = 10
net.numOfHonestNodes = 10
net.numOfMaliciousNodes = 0
net.topology = complete
net.throughputMean = 1.0E+12f
net.throughputSD = 0f
net.latencyMean = 100f
net.latencySD = 0f

# A light workload, 1 tx every 10 s. Belief is tracked for a transaction arriving before the
# partition (150, at about 25 min) and two arriving during it (200 and 220, at about 33 and 37 min).
workload.lambda = 0.1f
workload.numTransactions = 540
workload.sampleTransaction = {150, 200, 220}
workload.txSizeMean = 250f
workload.txSizeSD = 50f
workload.txFeeValueMean = 1000f
workload.txFeeValueSD = 500f

reporter.reportEvents = false
reporter.reportTransactions = true
reporter.reportNodes = true
reporter.reportNetEvents = false
reporter.reportBeliefs = true
reporter.reportBlockEvents = true
reporter.reportStructureEvents = true

# The same nodes in every simulation, each with its own random stream from t = 0.
node.sampler.seed = {444,222}
node.sampler.updateSeedFlags = {false,true}
node.sampler.seedUpdateTimes = {0}
node.maliciousPowerByRatio = true
node.maliciousRatio = 0.3
node.electricPowerMean = 1375f
node.electricPowerSD = 20f
node.electricCostMean = 0.1f
node.electricCostSD = 0.05f

net.sampler.seed = 123
net.sampler.seed.updateSeed = false

workload.sampler.seed = 321
workload.sampler.seed.updateSeed = true

bitcoin.minValueToMine = -1
bitcoin.minSizeToMine = 1
bitcoin.blockProcessingDelayPerByte = 0
bitcoin.txProcessingDelayPerByte = 0
# Transactions of the orphaned branch go back to the pool, as real nodes do.
bitcoin.reorg.restoreTransactions = true
