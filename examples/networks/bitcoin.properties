# Bitcoin preset for CNSim.
# Proof of work, 10-minute target, 4M weight units per block (1,000,000 vbytes; sizes below are
# vbytes). Bitcoin Core opens 8 outbound full-relay connections per node.
#
# Numbers are approximate public figures meant as a starting point, not measurements: the
# transaction rate and size are illustrative loads, and the 20 nodes stand for mining or
# stake pools. Run from the repository root:
#   java -jar target/cnsim-0.0.1-SNAPSHOT.jar -c examples/networks/bitcoin.properties
# See examples/networks/README.md.

sim.numSimulations = 10
sim.maxNodes = 64
sim.maxTransactions = 72000
sim.terminate.atTime = 14400000
sim.reporting.window = 100000
sim.reporting.beliefReportInterval = 5000
sim.reporting.beliefReportOffset = 0
sim.output.directory = ./out/bitcoin/

# Block production
pow.targetBlockInterval = 600000
pow.hashPowerMean = 1.0E+10
pow.hashPowerSD = 6.0E+9
bitcoin.maxBlockSize = 1000000

# Peer-to-peer overlay: each node opens 8 outbound links; 50 Mbps / 60 ms links on average;
# relays forward after 20 ms.
net.numOfNodes = 20
net.numOfHonestNodes = 20
net.topology = random-outbound
net.topology.degree = 8
net.topology.hopDelay = 20
net.throughputMean = 50000000f
net.throughputSD = 20000000f
net.latencyMean = 60f
net.latencySD = 30f

# Workload: 5.0 tx/s for 4 h; belief is tracked for transactions arriving at
# about 30 min, 60 min, 120 min.
workload.lambda = 5.0f
workload.numTransactions = 72000
workload.sampleTransaction = {9000, 18000, 36000}
workload.txSizeMean = 250f
workload.txSizeSD = 150f
workload.txFeeValueMean = 3000f
workload.txFeeValueSD = 1500f

# Reporting. EventLog is off: it holds one line per event and gets large quickly.
reporter.reportEvents = false
reporter.reportTransactions = true
reporter.reportNodes = true
reporter.reportNetEvents = true
reporter.reportBeliefs = true
reporter.reportBlockEvents = true
reporter.reportStructureEvents = true

# Node attributes (only relative hash power / stake matters once the block interval is set).
node.sampler.seed = {444,222}
node.sampler.updateSeedFlags = {false,true}
# Every simulation gets the same nodes (drawn with seed 444 during setup) and then switches to
# its own random stream (222 + simulation ID) at t = 0, before any node starts mining. Switching
# later leaves mining intervals drawn before the switch shared by all simulations, which makes
# the replicas correlated.
node.sampler.seedUpdateTimes = {0}
node.createMaliciousNode = false
node.maliciousPowerByRatio = true
node.maliciousRatio = 0.3
node.electricPowerMean = 1375f
node.electricPowerSD = 20f
node.electricCostMean = 0.1f
node.electricCostSD = 0.05f

net.sampler.seed = 123
net.sampler.seed.updateSeed = false
net.numOfMaliciousNodes = 0

workload.sampler.seed = 321
workload.sampler.seed.updateSeed = true

# -1 lets nodes mine empty blocks when the mempool is empty, as real miners do; with the
# default of 1 block production pauses until the next transaction arrives.
bitcoin.minValueToMine = -1
bitcoin.minSizeToMine = 1
bitcoin.blockProcessingDelayPerByte = 0
bitcoin.txProcessingDelayPerByte = 0
# Return transactions of blocks that leave the main chain to the pool, as real nodes do.
bitcoin.reorg.restoreTransactions = true
