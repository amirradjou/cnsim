# Double spend by a majority-style attacker (the thesis attack, MaliciousNodeBehavior): when the
# target transaction appears in a block, the attacker starts a hidden chain from that block's
# parent, keeps the target out of it, and reveals the hidden chain once it is longer than the
# public chain's growth and that growth exceeds bitcoin.attack.minChainLength confirmations. It
# gives up once the public chain has grown by bitcoin.attack.maxChainLength without being
# overtaken.
#
#   java -jar target/cnsim-0.0.1-SNAPSHOT.jar -c examples/attacks/double-spend.properties
#   python3 tools/attacks/double_spend_outcome.py out/double-spend/<run id>
# The script compares the success rate with the exact probability of the block race.
# See examples/attacks/README.md.

sim.numSimulations = 100
sim.maxNodes = 32
sim.maxTransactions = 2000
# 6 hours: the race is decided within maxChainLength + 1 public blocks of the target's block.
sim.terminate.atTime = 21600000
sim.reporting.window = 100000
sim.reporting.beliefReportInterval = 60000
sim.reporting.beliefReportOffset = 0
sim.output.directory = ./out/double-spend/

reporter.reportEvents = false
reporter.reportTransactions = false
reporter.reportNodes = true
reporter.reportNetEvents = false
reporter.reportBeliefs = true
reporter.reportBlockEvents = true
reporter.reportStructureEvents = true

# The attack. node.maliciousRatio is the attacker's share of the total hash power.
net.numOfMaliciousNodes = 1
node.createMaliciousNode = true
node.maliciousPowerByRatio = true
node.maliciousRatio = 0.3
workload.targetTransaction = 5
workload.sampleTransaction = {5}
bitcoin.attack.minChainLength = 2
bitcoin.attack.maxChainLength = 15

pow.targetBlockInterval = 600000
pow.hashPowerMean = 1.0E+10
pow.hashPowerSD = 2.0E+9
consensus.tieBreak = first-seen
bitcoin.maxBlockSize = 1000000
bitcoin.minSizeToMine = 1
bitcoin.minValueToMine = -1
bitcoin.reorg.restoreTransactions = true

net.numOfNodes = 11
net.numOfHonestNodes = 10
net.throughputMean = 100000000f
net.throughputSD = 10000000f
net.latencyMean = 50f
net.latencySD = 20f
net.sampler.seed = 123
net.sampler.seed.updateSeed = false

workload.sampler.seed = 321
workload.sampler.seed.updateSeed = true
# A light load keeps the logs small; the attack only needs the target transaction.
workload.lambda = 0.05f
workload.numTransactions = 1080
workload.txSizeMean = 250f
workload.txSizeSD = 100f
workload.txFeeValueMean = 1000f
workload.txFeeValueSD = 200f

node.sampler.seed = {444,222}
node.sampler.updateSeedFlags = {false,true}
node.sampler.seedUpdateTimes = {0}
node.electricPowerMean = 1375f
node.electricPowerSD = 20f
node.electricCostMean = 0.1f
node.electricCostSD = 0.05f
