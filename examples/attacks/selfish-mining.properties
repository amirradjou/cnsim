# Selfish mining (Eyal and Sirer 2014): one pool with node.selfishRatio of the hash power
# withholds its blocks and publishes them strategically; 10 honest pools follow the protocol.
# Honest nodes break ties between equally long branches by first-seen, as Bitcoin Core does, so
# the share of honest power that builds on the selfish block in a race (gamma) comes from the
# network: the selfish pool publishes when it hears an honest block, and whichever of the two a
# node receives first wins its vote.
#
#   java -jar target/cnsim-0.0.1-SNAPSHOT.jar -c examples/attacks/selfish-mining.properties
#   python3 tools/attacks/selfish_revenue.py out/selfish-mining/<run id>
# or sweep the selfish share and compare with the closed form:
#   tools/attacks/selfish_sweep.sh
# See examples/attacks/README.md.

sim.numSimulations = 10
sim.maxNodes = 32
sim.maxTransactions = 4000
# 100 hours: about 600 blocks per simulation.
sim.terminate.atTime = 360000000
sim.reporting.window = 100000
sim.reporting.beliefReportInterval = 600000
sim.reporting.beliefReportOffset = 0
sim.output.directory = ./out/selfish-mining/

reporter.reportEvents = false
reporter.reportTransactions = false
reporter.reportNodes = true
reporter.reportNetEvents = false
reporter.reportBeliefs = true
reporter.reportBlockEvents = true
reporter.reportStructureEvents = true

# Block production: Bitcoin's 10-minute interval, mining never pauses.
pow.targetBlockInterval = 600000
pow.hashPowerMean = 1.0E+10
pow.hashPowerSD = 2.0E+9
consensus.tieBreak = first-seen
bitcoin.maxBlockSize = 1000000
bitcoin.minSizeToMine = 1
bitcoin.minValueToMine = -1
bitcoin.reorg.restoreTransactions = true

# 10 honest pools plus the selfish one on a complete network with 50 ms (+- 20) latency.
net.numOfNodes = 11
net.numOfHonestNodes = 10
net.numOfMaliciousNodes = 0
net.numOfSelfishNodes = 1
node.selfishRatio = 0.35
net.throughputMean = 100000000f
net.throughputSD = 10000000f
net.latencyMean = 50f
net.latencySD = 20f
net.sampler.seed = 123
net.sampler.seed.updateSeed = false

# A trickle of transactions (only the first matters: mining starts when it arrives).
workload.sampler.seed = 321
workload.sampler.seed.updateSeed = true
workload.lambda = 0.01f
workload.numTransactions = 3600
workload.sampleTransaction = {1}
workload.txSizeMean = 250f
workload.txSizeSD = 100f
workload.txFeeValueMean = 1000f
workload.txFeeValueSD = 200f

node.sampler.seed = {444,222}
node.sampler.updateSeedFlags = {false,true}
node.sampler.seedUpdateTimes = {0}
node.createMaliciousNode = false
node.maliciousPowerByRatio = true
node.maliciousRatio = 0.3
node.electricPowerMean = 1375f
node.electricPowerSD = 20f
node.electricCostMean = 0.1f
node.electricCostSD = 0.05f
