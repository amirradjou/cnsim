# Golden-run configuration: a tiny but complete scenario (5 honest miners, one
# majority attacker, forks, belief reports, every log switched on) that runs in
# about a second. tools/golden/check.sh runs it and compares the SHA-256 of each
# log, with wall-clock columns removed, against tools/golden/expected.sha256.
# Any change to simulation semantics changes a hash; refresh them deliberately
# with `tools/golden/check.sh --update <jar>` and say why in the commit.

sim.numSimulations = 2
sim.maxNodes = 10
sim.maxTransactions = 5000
sim.terminate.atTime = 3600000
sim.reporting.window = 100000
sim.reporting.beliefReportInterval = 10000
sim.reporting.beliefReportOffset = 0
sim.output.directory = ./golden-log/

reporter.reportEvents = true
reporter.reportTransactions = true
reporter.reportNodes = true
reporter.reportNetEvents = true
reporter.reportBeliefs = true
reporter.reportBlockEvents = true
reporter.reportStructureEvents = true

net.sampler.seed = 123
net.sampler.seed.updateSeed = false
net.numOfNodes = 6
net.numOfHonestNodes = 5
net.numOfMaliciousNodes = 1
net.throughputMean = 25000000f
net.throughputSD = 2500000f

workload.sampler.seed = 321
workload.sampler.seed.updateSeed = true
workload.lambda = 1f
workload.numTransactions = 3000
workload.sampleTransaction = {500, 1000, 1500}
workload.targetTransaction = 500
workload.txSizeMean = 225f
workload.txSizeSD = 120.471f
workload.txFeeValueMean = 1307.28f
workload.txFeeValueSD = 130.3f

# The per-simulation node seed takes over at t = 1 s, so the two replicas diverge.
node.sampler.seed = {444,222}
node.sampler.updateSeedFlags = {false,true}
node.sampler.seedUpdateTimes = {1000}
node.createMaliciousNode = true
node.maliciousPowerByRatio = true
node.maliciousRatio = 0.4
node.electricPowerMean = 1375f
node.electricPowerSD = 20f
node.electricCostMean = 0.1f
node.electricCostSD = 0.05f

# About one block a minute for 5 x 71.7 EH/s honest + 40% attacker.
pow.difficulty = 3.6E+22
pow.hashPowerMean = 7.1714545E+10
pow.hashPowerSD = 1.1122961E+10

bitcoin.maxBlockSize = 1000000
bitcoin.minSizeToMine = 1
bitcoin.minValueToMine = 1
